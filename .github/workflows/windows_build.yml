name: Windows build

on: [push, pull_request]

jobs:
  build:
    
    runs-on: windows-2022
    env:
      OPENBLAS_VERSION: 0.3.30
      OPENBLAS_SHA256: 8b04387766efc05c627e26d24797ec0d4ed4c105ec14fa7400aa84a02db22b66

    strategy:
      matrix:
        python-version: ['3.14']
        include:
        - ARCH: x64
          MSVC_TARGET: 64
          PLAT_NAME: win-amd64

    steps:

    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.ARCH}}

    - name: Setup msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: coreutils unzip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools setuptools_scm build wheel pytest pytest-cov coveralls

    - name: Get OpenBLAS and copy to workspace
      shell: msys2 {0}
      run: |
          wget https://github.com/OpenMathLib/OpenBLAS/releases/download/v${OPENBLAS_VERSION}/OpenBLAS-${OPENBLAS_VERSION}-${{matrix.ARCH}}.zip
          wget https://raw.githubusercontent.com/OpenMathLib/OpenBLAS/v${OPENBLAS_VERSION}/LICENSE -O LICENSE_OpenBLAS-${OPENBLAS_VERSION}
          echo "${{matrix.OPENBLAS_SHA256}}  OpenBLAS-${OPENBLAS_VERSION}-${{matrix.ARCH}}.zip" > OpenBLAS.sha256
          sha256sum -c OpenBLAS.sha256
          mkdir src/python/.libs
          mkdir OpenBLAS
          unzip OpenBLAS-${OPENBLAS_VERSION}-${{matrix.ARCH}}.zip -d OpenBLAS/
          cp OpenBLAS/bin/libopenblas.dll src/python/.libs
          cp OpenBLAS/lib/libopenblas.lib libopenblas.lib       
          cp LICENSE_OpenBLAS-${OPENBLAS_VERSION} src/python  
          echo "CHOMPACK_BLAS_LIB_DIR=${{github.workspace}}" >> $GITHUB_ENV
          echo "CHOMPACK_BLAS_LIB=libopenblas" >> $GITHUB_ENV
          echo "CHOMPACK_LAPACK_LIB=libopenblas" >> $GITHUB_ENV

    - name: Build/install CHOMPACK
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars${{matrix.MSVC_TARGET}}.bat"
        python -m build --wheel
        pip install --no-index --find-links=${{github.workspace}}\dist chompack

    - name: Test
      shell: cmd
      run: |
        pytest --cov=chompack tests
