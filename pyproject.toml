[build-system]
requires = ["setuptools>=80", "setuptools_scm[toml]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "chompack"
dynamic = ["version"]
description = "Library for chordal matrix computations"
requires-python = ">=3.8"
readme = {file = "README.md", content-type = "text/markdown"}
license = "GPL-3.0-or-later"
authors = [
    {name = "Martin S. Andersen", email = "martin.skovgaard.andersen@gmail.com"},
    {name = "Lieven Vandenberghe", email = "vandenbe@ee.ucla.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cvxopt >= 1.3.3"
]

[project.urls]
Homepage = "https://cvxopt.github.io/chompack/"
Source = "https://github.com/cvxopt/chompack"


[tool.setuptools]
package-dir = {"chompack" = "src/python"}
packages = ["chompack", "chompack.pybase"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"*" = ["LICENSE*", ".libs/*.dll"]

[tool.cibuildwheel]
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
archs = "x86_64 aarch64"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
before-all = "if ldd --version 2>&1 | grep -q musl; then apk add --no-cache openblas-dev; else yum install -y openblas-devel; fi"
environment = {CHOMPACK_BLAS_LIB = "openblas", CHOMPACK_LAPACK_LIB = "openblas"}

[tool.cibuildwheel.macos]
archs = "x86_64 arm64"

[tool.cibuildwheel.windows]
archs = "x86_64"
environment = {CHOMPACK_BLAS_LIB = "libopenblas", CHOMPACK_LAPACK_LIB = "libopenblas", CHOMPACK_BLAS_LIB_DIR = "{project}"}

[tool.setuptools_scm]
write_to = "src/python/_version.py"
